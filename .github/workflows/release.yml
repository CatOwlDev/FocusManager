name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
      # ---------------------------------------------------
      # Checkout
      # ---------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------
      # Configure CMake
      # ---------------------------------------------------

      - name: Configure CMake
        run: >
          cmake
          -S .
          -B build
          -G "Visual Studio 17 2022"
          -A x64

      # ---------------------------------------------------
      # Build
      # ---------------------------------------------------

      - name: Build FocusManager
        run: >
          cmake
          --build build
          --config Release
          --parallel

      # ---------------------------------------------------
      # Verify executable exists
      # ---------------------------------------------------

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "build\Release\FocusManager.exe")) {
              Write-Error "FocusManager.exe was not built!"
              exit 1
          }

          Write-Host "Build successful:"
          Get-Item "build\Release\FocusManager.exe"

      # ---------------------------------------------------
      # Install Inno Setup
      # ---------------------------------------------------

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y

      # ---------------------------------------------------
      # Build installer
      # ---------------------------------------------------

      - name: Build installer
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")

          Write-Host "Building installer for version $version"

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=$version" `
            "installer\FocusManager.iss"

          if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
          }

      # ---------------------------------------------------
      # Show generated files
      # ---------------------------------------------------

      - name: List release files
        shell: pwsh
        run: |
          Get-ChildItem -Path dist -Recurse

      # ---------------------------------------------------
      # Create GitHub Release
      # ---------------------------------------------------

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/FocusManager-Setup-*.exe
          generate_release_notes: true
