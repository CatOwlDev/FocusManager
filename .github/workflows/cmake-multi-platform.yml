name: CMake Build and Release

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Принудительно и надежно стираем старый кэш средствами Windows
    - name: Clear Old Cache
      shell: powershell
      run: |
        if (Test-Path build) { Remove-Item -Recurse -Force build }

    # Конфигурация CMake
    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_CXX_COMPILER=cl
        -DCMAKE_C_COMPILER=cl
        -DCMAKE_BUILD_TYPE=Release
        -S .

    # Сборка финального релиза программы
    - name: Build
      run: cmake --build build --config Release

    # Подготовка файлов и добавление инструкции по Visual C++ Redistributable
    - name: Prepare Release Artifacts
      shell: bash
      run: |
        mkdir -p dist
        cp build/Release/FocusManager.exe dist/
        
        echo "==========================================================" > dist/README_BEFORE_RUN.txt
        echo "IMPORTANT: If the program does not start or shows a missing DLL error," >> dist/README_BEFORE_RUN.txt
        echo "please download and install Microsoft Visual C++ Redistributable from Microsoft:" >> dist/README_BEFORE_RUN.txt
        echo "https://aka.ms" >> dist/README_BEFORE_RUN.txt
        echo "==========================================================" >> dist/README_BEFORE_RUN.txt

    # Упаковываем .exe и текстовый файл в ZIP
    - name: Archive Release
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath FocusManager-windows-x64.zip -Force

    # Автоматически загружаем ZIP-архив в ваш релиз
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: FocusManager-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
