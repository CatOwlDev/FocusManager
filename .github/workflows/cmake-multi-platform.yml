name: CMake Build and Release

on:
  release:
    types: [published] # Скрипт срабатывает автоматически только при создании и публикации Релиза

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set reusable strings
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"

    # Конфигурация CMake с явным указанием компилятора MSVC (cl)
    - name: Configure CMake
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=cl
        -DCMAKE_C_COMPILER=cl
        -DCMAKE_BUILD_TYPE=Release
        -S ${{ github.workspace }}

    # Сборка финального релиза программы
    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release

    # Подготовка файлов и добавление инструкции по Visual C++ Redistributable
    - name: Prepare Release Artifacts
      shell: bash
      run: |
        mkdir -p dist
        
        # ⚠️ ВАЖНО: Замените FocusManager.exe на точное имя вашего исполняемого файла!
        # CMake по умолчанию собирает его в папку build/Release/
        cp "${{ steps.strings.outputs.build-output-dir }}/Release/FocusManager.exe" dist/
        
        # Создаем текстовый файл с инструкцией и официальной ссылкой на vc_redist
        echo "==========================================================" > dist/README_BEFORE_RUN.txt
        echo "IMPORTANT: If the program does not start or shows a missing DLL error," >> dist/README_BEFORE_RUN.txt
        echo "please download and install Microsoft Visual C++ Redistributable from Microsoft:" >> dist/README_BEFORE_RUN.txt
        echo "https://aka.ms" >> dist/README_BEFORE_RUN.txt
        echo "==========================================================" >> dist/README_BEFORE_RUN.txt

    # Упаковываем .exe и текстовый файл в один ZIP-архив
    - name: Archive Release
      uses: theakson/tar-archiver@v1.0.3
      with:
        src: dist
        dst: FocusManager-windows-x64.zip

    # Автоматически загружаем ZIP-архив прямо в созданный вами релиз
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: FocusManager-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
