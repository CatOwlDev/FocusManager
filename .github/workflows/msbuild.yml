name: MSBuild Build and Release

on:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: nuget/setup-nuget@v2

    # Робот автоматически скачает nlohmann и ftxui для Visual Studio
    - name: Restore NuGet Packages
      run: nuget restore FocusManager.vcxproj -PackagesDirectory packages

    # Запускаем сборку проекта через родной MSBuild
    - name: Build Project
      run: msbuild FocusManager.vcxproj /p:Configuration=Release /p:Platform=x64

    # Подготовка файлов к публикации
    - name: Prepare Release Artifacts
      shell: bash
      run: |
        mkdir -p dist
        cp x64/Release/FocusManager.exe dist/ 2>/dev/null || cp Release/FocusManager.exe dist/
        
        echo "==========================================================" > dist/README_BEFORE_RUN.txt
        echo "IMPORTANT: If the program does not start, please install Microsoft Visual C++ Redistributable:" >> dist/README_BEFORE_RUN.txt
        echo "https://aka.ms" >> dist/README_BEFORE_RUN.txt
        echo "==========================================================" >> dist/README_BEFORE_RUN.txt

    - name: Archive Release
      shell: powershell
      run: |
        Compress-Archive -Path dist\* -DestinationPath FocusManager-windows-x64.zip -Force

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: FocusManager-windows-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
